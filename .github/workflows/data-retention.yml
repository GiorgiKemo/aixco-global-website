name: Operational data retention recovery

on:
  schedule:
    # Vercel Cron runs the primary daily purge. GitHub provides a delayed,
    # best-effort recovery invocation in case that run fails.
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-data-retention-production
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Purge expired operational data
        env:
          CRON_SECRET: ${{ secrets.CONTACT_EMAIL_CRON_SECRET }}
          ENDPOINT: https://www.aixco.global/api/cron/data-retention
        shell: bash
        run: |
          set -euo pipefail
          if [[ ${#CRON_SECRET} -lt 32 ]]; then
            echo "CONTACT_EMAIL_CRON_SECRET is missing or too short."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --retry 2 \
            --retry-all-errors \
            --max-time 50 \
            "${ENDPOINT}"
