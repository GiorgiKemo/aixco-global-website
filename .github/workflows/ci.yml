name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:test

      - name: Validate ordered database migrations
        run: node scripts/verify-migration-history.mjs

      - name: Enforce append-only migration history
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            echo "No comparison commit is available; ordered migration validation still ran."
            exit 0
          fi

          changes=$(git diff --name-status "${BASE_SHA}" HEAD -- supabase/migrations)
          while IFS=$'\t' read -r status path remainder; do
            [[ -z "${status}" ]] && continue
            if [[ "${status}" != "A" ]]; then
              echo "Migration history is append-only; ${status} ${path} is not allowed."
              exit 1
            fi
          done <<< "${changes}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start isolated test database
        run: supabase db start

      - name: Replay every database migration from zero
        run: supabase db reset --local --no-seed

      - name: Lint migrated database schema
        run: supabase db lint --local --level warning --fail-on error

      - name: Stop isolated test database
        if: always()
        run: supabase stop --no-backup

      - name: Test
        run: npm run test:coverage

      - name: Verify static translation coverage
        run: npm run test:i18n

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build
        env:
          # Browser gates exercise many fresh contexts in a few minutes. Disable
          # optional production telemetry in this isolated build so the gates
          # validate the customer experience without depending on live storage.
          NEXT_PUBLIC_WEB_VITALS_SAMPLE_RATE: "0"
        run: npm run build

      - name: Enforce production asset budgets
        run: node scripts/verify-production-budgets.mjs

      - name: Install Chromium for browser gates
        run: npx playwright install --with-deps chromium

      - name: Run production browser gates
        shell: bash
        env:
          SMOKE_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          npm run preview > /tmp/aixco-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill ${PREVIEW_PID} 2>/dev/null || true' EXIT

          for attempt in {1..45}; do
            if curl --fail --silent --show-error "${SMOKE_URL}" > /dev/null; then
              break
            fi
            if ! kill -0 "${PREVIEW_PID}" 2>/dev/null; then
              cat /tmp/aixco-preview.log
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error "${SMOKE_URL}" > /dev/null
          npm run smoke
          npm run smoke:locales
          npm run smoke:languages
          npm run smoke:dubai
          npm run smoke:nav
          npm run smoke:mobile
          npm run smoke:mobile-scope

      - name: Upload preview logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-preview-logs
          path: /tmp/aixco-preview.log
          if-no-files-found: ignore
          retention-days: 7

  production-release-gate:
    name: Production release gate
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification gate
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "${VERIFY_RESULT}" != "success" ]; then
            echo "Production release blocked because verification finished with: ${VERIFY_RESULT}"
            exit 1
          fi
          echo "All code, migration, dependency, build, and browser gates passed."
