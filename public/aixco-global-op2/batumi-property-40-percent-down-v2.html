const translations = {
  en: {
    flag:'🇬🇧', dir:'ltr', kicker:'Investment Guide',
    title:'How to Buy Batumi Property with Only 40% Down Payment',
    subtitle:'The quiet leverage opportunity emerging on the Black Sea.',
    body:`
<h2>60% Financing Explained</h2>
<p>In most global property markets, leverage has become restrictive. Debt is expensive, loan-to-value ratios are tightening, and foreign buyers are often sidelined. Batumi is moving in the opposite direction.</p>
<p>On Georgia’s Black Sea coast, investors are quietly structuring deals with as little as 40% equity and 60% developer or bank financing, effectively amplifying returns in a market that is already growing at a compelling pace.</p>
<p>This is not a theoretical play. It is a structural inefficiency—one that exists at the intersection of rapid market expansion, developer-led financing models, and a foreign-investor-friendly regulatory framework.</p>

<h2>Batumi by the Numbers: A Market in Acceleration</h2>
<p class="source-note">Source: Metropolitan Real Estate, TBC Capital, Global Property Guide</p>
<p>The first step in understanding why leverage matters here is recognizing the underlying momentum of the asset itself.</p>
<p>Batumi is no longer an emerging market story—it is an expanding one.</p>
<p>In 2025, approximately 17,478 apartments were sold, marking a 15% year-on-year increase, with total transaction volume surpassing $1.3 billion, according to data published by Metropolitan Real Estate. At the same time, average new-build prices climbed to roughly $1,865 per square meter, reflecting an annual increase of about 9.4%, based on the same dataset.</p>
<p>Independent market commentary from Global Property Guide and regional broker reports place the broader pricing spectrum in the $1,200–$1,800/m² range, depending on proximity to the coastline and project quality. Forward-looking estimates cited by GEOLN suggest annual appreciation in the 8–10% range for prime coastal segments.</p>
<p>This growth is not speculative. It is supported by structural demand dynamics.</p>
<p>Foreign buyers have accounted for up to 80% of transactions in certain periods, a figure highlighted in market briefings by Metropolitan Real Estate, while tourism inflows—tracked and analyzed by Global Property Guide—continue to underpin short-term rental demand. Yield expectations reflect this demand, with gross rental returns typically ranging from 7% to 12%, according to brokerage estimates compiled by Neginski Real Estate.</p>
<p>In other words, leverage is being applied to an already appreciating and income-generating asset base.</p>

<h2>The 40/60 Model: How Financing Actually Works in Batumi</h2>
<p class="source-note">Source: Developer disclosures, GEOLN, market analysis</p>
<p>Unlike Western mortgage systems, Batumi’s financing ecosystem is heavily developer-driven.</p>
<p><strong>1. Developer Financing (Primary Market)</strong></p>
<p>This is the dominant structure. Developers across Batumi routinely offer installment-based acquisition models that require 30%–40% upfront, with the remaining balance paid over time. As noted in regional developer disclosures and summarized by GEOLN, these plans often carry low or even zero interest during construction, typically spanning 2–5 years.</p>
<p>Developers effectively act as lenders, allowing buyers to secure units early while spreading capital deployment.</p>
<p><strong>2. Bank Financing (Limited but Expanding)</strong></p>
<p>Georgian banks do offer mortgages, though access for foreign investors remains selective. Market commentary from Global Property Guide indicates that bank loans tend to require stronger documentation and are more commonly used after project completion, often at higher effective rates than developer-led plans.</p>
<p><strong>3. Hybrid Structures</strong></p>
<p>Sophisticated investors increasingly combine both approaches, entering through developer financing and refinancing post-delivery through local banks, creating a staged leverage profile that optimizes liquidity and cost of capital.</p>

<h2>Why 60% Financing Matters: Return Amplification</h2>
<p class="source-note">Source: Internal analysis based on market assumptions</p>
<p>Assume a $100,000 beachfront unit:</p>
<ul><li>Investor equity: $40,000</li><li>Financing: $60,000</li></ul>
<p>Now layer in Batumi fundamentals:</p>
<ul><li>Annual price growth: ~8–10% (as cited by GEOLN)</li><li>Rental yield: ~7–10% (based on estimates from Neginski Real Estate)</li></ul>
<div class="highlight-box"><p><strong>Leveraged Return Dynamics</strong></p><p>Without leverage: 10% appreciation equals a $10,000 gain on $100,000, or a 10% return on equity.</p><p>With 60% financing: the same $10,000 gain is measured against $40,000 of equity, producing a 25% return on equity before rental income.</p></div>
<p>Add a conservative 7% yield:</p>
<ul><li>~$7,000 annual income</li><li>On $40,000 equity = 17.5% cash yield</li></ul>
<p>Combined, this can create 40%+ blended annual return potential in strong cycles.</p>
<p>This is precisely why international capital—particularly from the Middle East and Eastern Europe—is flowing into Batumi, a trend consistently noted in transaction analyses published by Metropolitan Real Estate.</p>

<h2>Price Growth + Leverage: A Compounding Effect</h2>
<p class="source-note">Source: BD Group, Georgia Today, Metropolitan Real Estate</p>
<p>Batumi’s price trajectory reinforces the leverage thesis.</p>
<p>Historical pricing analysis published by BD Group shows that values have risen from below $600/m² prior to 2015 to well above $1,500/m² in many modern developments today. More recent reporting from Georgia Today confirms that both transaction volumes and pricing metrics continued to rise into 2025, with double-digit increases in overall market value.</p>
<p>At the same time, updated figures from Metropolitan Real Estate indicate sustained annual price growth in new-build segments, supported by continued foreign demand and limited prime coastal supply.</p>
<p>Leverage in a stagnant market is dangerous. Leverage in a growth market is transformative.</p>

<h2>Risk Considerations: Where Discipline Matters</h2>
<p>A leveraged strategy is only as strong as its underwriting.</p>
<p>Three risks deserve attention:</p>
<ol><li><strong>Supply Concentration:</strong> Batumi has a high volume of new developments, and oversupply in lower-tier projects can compress yields if not carefully selected.</li><li><strong>Seasonality:</strong> Unlike Tbilisi, Batumi remains partially tourism-driven, which introduces variability in short-term rental income.</li><li><strong>Developer Quality:</strong> Because financing is often developer-led, counterparty risk is elevated relative to traditional mortgage markets, making due diligence on track record essential.</li></ol>
<p>Institutional-grade investors mitigate these risks by focusing on first-line coastal assets, branded developments, and projects with proven delivery histories.</p>

<h2>Why This Window Exists and Won’t Last Forever</h2>
<p>This financing model is not permanent.</p>
<p>It exists today because the Georgian mortgage market is still developing, and developers are incentivized to accelerate absorption. As the sector matures, financing conditions are likely to normalize toward more conventional banking structures.</p>
<p>As that happens:</p>
<ul><li>Bank financing will standardize</li><li>Interest rates will align with regional norms</li><li>Loan-to-value ratios may tighten</li></ul>
<p>In other words, the current 40/60 structure is a transitional inefficiency—one that tends to disappear as markets institutionalize.</p>

<h2>Final Word: Leverage in the Right Market</h2>
<p>Batumi offers a rare alignment:</p>
<ul><li>High-growth coastal city</li><li>Strong foreign demand</li><li>Attractive rental yields</li><li>Accessible leverage at low entry thresholds</li></ul>
<p>When these variables converge, the result is not just investment—it is capital efficiency.</p>
<p>For investors who understand how to structure deals, the 40% down payment model is not simply a financing option. It is the difference between participating in a market—and outperforming it.</p>`
  }

function pseudoTranslate(base, lang){
  const labels = {
    de:['Investmentleitfaden','So kaufen Sie Immobilien in Batumi mit nur 40% Anzahlung','Die stille Hebelchance am Schwarzen Meer.'],
    ru:['Инвестиционный гид','Как купить недвижимость в Батуми всего с 40% первоначального взноса','Тихая возможность использования кредитного плеча на Черном море.'],
    ka:['საინვესტიციო გზამკვლევი','როგორ ვიყიდოთ ბათუმის ქონება მხოლოდ 40% წინასწარი გადახდით','მშვიდი ბერკეტის შესაძლებლობა შავი ზღვის სანაპიროზე.'],
    tr:['Yatırım Rehberi','Yalnızca %40 Peşinatla Batum Gayrimenkulü Nasıl Alınır','Karadeniz’de ortaya çıkan sessiz kaldıraç fırsatı.'],
    ar:['دليل استثماري','كيفية شراء عقار في باتومي بدفعة أولى 40% فقط','فرصة الرافعة المالية الهادئة الناشئة على البحر الأسود.']
  };
  return {flag:{de:'🇩🇪',ru:'🇷🇺',ka:'🇬🇪',tr:'🇹🇷',ar:'🇸🇦'}[lang], dir: lang==='ar'?'rtl':'ltr', kicker:labels[lang][0], title:labels[lang][1], subtitle:labels[lang][2], body:base.body};
}
['de','ru','ka','tr','ar'].forEach(l=>translations[l]=pseudoTranslate(translations.en,l));

const switcher = document.getElementById('languageSwitcher');
const toggle = document.getElementById('languageSwitcherToggle');
const buttons = document.querySelectorAll('.language-option');
toggle.addEventListener('click',()=>switcher.classList.toggle('open'));
document.addEventListener('click',(e)=>{ if(!switcher.contains(e.target)) switcher.classList.remove('open'); });
function setLang(lang){
  const t = translations[lang] || translations.en;
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;
  document.getElementById('currentLanguageFlag').textContent = t.flag;
  document.getElementById('kicker').textContent = t.kicker;
  document.getElementById('articleTitle').textContent = t.title;
  document.getElementById('articleSubtitle').textContent = t.subtitle;
  document.getElementById('articleBody').innerHTML = t.body;
  buttons.forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
  switcher.classList.remove('open');
}
buttons.forEach(btn=>btn.addEventListener('click',()=>setLang(btn.dataset.lang)));
setLang('en');
</script>
